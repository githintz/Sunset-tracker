name: Record fixtures

# Records real Open-Meteo responses for the test spots and commits them to the branch it ran on.
on:
  workflow_dispatch:
    inputs:
      now:
        description: Optional ISO time to treat as "now"
        required: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record
        run: |
          if [ -n "${{ inputs.now }}" ]; then npx tsx scripts/record-fixtures.ts --now "${{ inputs.now }}"; else npx tsx scripts/record-fixtures.ts; fi
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures
          git commit -m "Record Open-Meteo fixtures ($(date -u +%Y-%m-%dT%H:%MZ))" || echo "No changes"
          # the branch may have moved while recording
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
