name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk: ${{ steps.out.outputs.apk }}
      sha256: ${{ steps.out.outputs.sha256 }}
      signing: ${{ steps.keystore.outputs.signing }}
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Capacitor 8 / AGP 8.13 / Gradle 8.14: JDK 21, compileSdk 36, minSdk 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Version
        run: |
          V=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$V-build.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
      - run: npm run build:android
      - run: npx cap sync android
      - name: Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "KEYSTORE_FILE=$KS"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signing=persistent" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set — signing with a throwaway key. This APK installs, but later builds will not install over it. Run scripts/create-keystore.sh once to fix."
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -storepass "$P" -keypass "$P" -alias ephemeral -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Glowcast ephemeral" -noprompt
            {
              echo "KEYSTORE_FILE=$KS"
              echo "KEYSTORE_PASSWORD=$P"
              echo "KEY_ALIAS=ephemeral"
              echo "KEY_PASSWORD=$P"
            } >> "$GITHUB_ENV"
            echo "signing=ephemeral" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        id: out
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT="glowcast-$VERSION_NAME.apk"
          cp "$APK" "$OUT"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee apksigner.txt
          "$BT/aapt" dump badging "$OUT" | tee badging.txt | head -5
          grep -q "package: name='io.github.githintz.glowcast' versionCode='$VERSION_CODE'" badging.txt || { echo "::error::Unexpected package/versionCode"; exit 1; }
          grep -q "minSdkVersion:'24'" badging.txt || grep -q "sdkVersion:'24'" badging.txt || { echo "::error::minSdk is not 24"; exit 1; }
          grep -q "targetSdkVersion:'36'" badging.txt || { echo "::error::targetSdk is not 36"; exit 1; }
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### APK"
            echo "- file: \`$OUT\`"
            echo "- sha256: \`$SHA\`"
            echo "- signing: ${{ steps.keystore.outputs.signing }}"
            echo '```'; grep -E "^package|sdkVersion|targetSdkVersion" badging.txt; grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" apksigner.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            glowcast-*.apk
            badging.txt
            apksigner.txt
          retention-days: 30

  smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoke.sh "$(ls apk/glowcast-*.apk | head -1)" smoke-out
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-screenshots
          path: smoke-out
          retention-days: 30

  release:
    name: GitHub Release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk
      - uses: softprops/action-gh-release@v3
        with:
          files: apk/glowcast-*.apk
          body: |
            Glowcast ${{ github.ref_name }} — Android APK built and signed by GitHub Actions run ${{ github.run_id }}.

            - SHA-256: `${{ needs.build.outputs.sha256 }}`
            - Signing: ${{ needs.build.outputs.signing }}
            - Web app: https://githintz.github.io/Sunset-tracker/

            Weather data by Open-Meteo.com (CC BY 4.0).
