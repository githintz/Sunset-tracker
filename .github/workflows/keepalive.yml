name: Keep scheduled workflows alive

# GitHub disables cron workflows after 60 days without repository activity. Re-enabling the maps
# workflow once a month through the API counts as activity and keeps the schedule running.
on:
  schedule:
    - cron: '41 4 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/maps.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/live.yml/enable" || true
