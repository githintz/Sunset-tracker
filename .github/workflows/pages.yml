name: Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      compute_maps:
        description: Recompute the map grids instead of reusing the published ones
        type: boolean
        default: false
  workflow_call:
    inputs:
      compute_maps:
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Map recomputes get their own group so a code push never cancels a pending maps run.
concurrency:
  group: pages-${{ github.ref }}-${{ inputs.compute_maps && 'maps' || 'code' }}
  cancel-in-progress: false

env:
  SITE_URL: https://githintz.github.io/Sunset-tracker

jobs:
  test:
    name: Typecheck, lint, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage gate (src/engine ≥ 90 %)
        run: node scripts/coverage-gate.mjs
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 3

  maps:
    name: Map grids
    if: inputs.compute_maps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run maps -- --out maps-out
      - uses: actions/upload-artifact@v7
        with:
          name: maps
          path: maps-out
          retention-days: 3

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, maps]
    if: >-
      always() && needs.test.result == 'success' && (needs.maps.result == 'success' || needs.maps.result == 'skipped') &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Fresh map grids
        if: inputs.compute_maps
        uses: actions/download-artifact@v8
        with:
          name: maps
          path: site/maps
      # Code-only deploys keep whatever grids are live *now* (fetched inside the serialized deploy job,
      # so a slow code deploy can't overwrite newer grids with older ones).
      - name: Keep the published map grids
        if: ${{ !inputs.compute_maps }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/maps/fetch-published.mjs" -o fetch-published.mjs
          node fetch-published.mjs "$SITE_URL" site/maps
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
